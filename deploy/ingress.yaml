apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: portfolio

  namespace: portfolio

spec:

  ingressClassName: nginx

  rules:

  - host: portfolio.example.com

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: portfolio-service

            port:

              number: 80